spring.application.name=${SPRING_APP_NAME:back-inmind-latam}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://qainminddb-instance-1.c7ia4m266sw5.us-east-2.rds.amazonaws.com:3306/InMindDB}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dbuser_qa_Andres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:andres123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}

spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.cache.type=redis

cache.ttl.minutes=${CACHE_TTL_MINUTES:120}

spring.devtools.restart.enabled=false

# Swagger/OpenAPI
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntaxHighlight.activated=true
springdoc.swagger-ui.syntaxHighlight.theme=monokai

# Enlace de redireccion para WhatsApp (parametrizable por variable de entorno)
